name: Daily Data Update

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy akshare --quiet

      - name: Run data fetch
        run: |
          cd fetchers
          python fetch_banks_qq_qfq.py
        continue-on-error: false

      - name: Validate data files
        run: |
          for f in data/ashare/*.csv; do
            lines=$(wc -l < "$f")
            if [ "$lines" -lt 10 ]; then
              echo "ERROR: $f has only $lines lines"
              exit 1
            fi
            echo "OK: $f ($lines lines)"
          done

      - name: Git commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ashare/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "auto: update daily data $(date +%Y-%m-%d)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: BARK Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            curl -s -G "https://api.day.app/${{ secrets.BARK_KEY }}/cn_banks_quant_ok" \
              --data-urlencode "group=quant" \
              --data-urlencode "title=数据更新成功" \
              --data-urlencode "body=银行回测数据已更新并部署" || true
          else
            curl -s -G "https://api.day.app/${{ secrets.BARK_KEY }}/cn_banks_quant_fail" \
              --data-urlencode "group=quant" \
              --data-urlencode "title=数据更新失败" \
              --data-urlencode "body=请检查GitHub Actions日志" || true
          fi
