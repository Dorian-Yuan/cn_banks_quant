<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国有六大行：股价与市净率 (PB) 关系分析</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;family=Noto+Sans+SC:wght@300;400;700&amp;display=swap" rel="stylesheet">
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-color: #58a6ff;
            --accent-color: #f78166;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --glass-blur: blur(12px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(24, 76, 143, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 44, 44, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #fff, #58a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-dim);
            font-weight: 300;
        }

        /* 银行选择器选项卡 */
        .bank-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
        }

        .tab:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
        }

        /* 数据概览卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            animation: fadeInUp 0.5s ease-out both;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }
        .stat-card:nth-child(5) { animation-delay: 0.5s; }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
        }

        .stat-price { color: var(--accent-color); }
        .stat-pb { color: var(--primary-color); }

        /* 图表容器 */
        .chart-main {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            height: 600px;
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        /* 动画 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            h1 { font-size: 1.6rem; }
            .chart-main { height: 400px; padding: 15px; }
            .stat-value { font-size: 1.2rem; }
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(88, 166, 255, 0.1);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <header>
            <h1>国有六大行估值分析</h1>
            <p class="subtitle">历史股价与市净率 (PB) 关系透视 · 数据起自 2018 年</p>
        </header>

        <div class="bank-tabs" id="bankSelector">
            <!-- 由 JS 填充 -->
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">当前股价 (复权)</div>
                <div class="stat-value stat-price" id="currPrice">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">最新市净率 (PB)</div>
                <div class="stat-value stat-pb" id="currPB">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">历史平均 PB</div>
                <div class="stat-value" id="avgPB">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">历史最高 PB</div>
                <div class="stat-value" id="maxPB">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">历史最低 PB</div>
                <div class="stat-value" id="minPB">-</div>
            </div>
        </div>

        <div class="chart-main" id="mainChart"></div>

        <footer style="text-align: center; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 40px;">
            注：股价为近10年复权价格，PB 数据源自东方财富。数据仅供分析参考。
        </footer>
    </div>

    <script>
        let bankData = null;
        let chart = null;
        let currentBank = '601398'; // 默认工行

        const bankList = [
            { id: '601398', name: '工商银行' },
            { id: '601939', name: '建设银行' },
            { id: '601988', name: '中国银行' },
            { id: '601288', name: '农业银行' },
            { id: '601328', name: '交通银行' },
            { id: '601658', name: '邮储银行' }
        ];

        async function init() {
            try {
                const response = await fetch('./data/bank_valuation.json');
                bankData = await response.json();
                
                renderBankTabs();
                initChart();
                updateDashboard(currentBank);
                
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            } catch (error) {
                console.error('Failed to load data:', error);
                alert('无法加载数据，请确保运行了 py 脚本且开启了本地服务器。');
            }
        }

        function renderBankTabs() {
            const container = document.getElementById('bankSelector');
            bankList.forEach(bank => {
                const tab = document.createElement('div');
                tab.className = `tab ${bank.id === currentBank ? 'active' : ''}`;
                tab.textContent = bank.name;
                tab.onclick = () => selectBank(bank.id);
                container.appendChild(tab);
            });
        }

        function selectBank(bankId) {
            currentBank = bankId;
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.textContent === bankData[bankId].name);
            });
            updateDashboard(bankId);
        }

        function updateDashboard(bankId) {
            const data = bankData[bankId];
            if (!data) return;

            // 更新指标卡
            document.getElementById('currPrice').textContent = '¥' + data.stats.latest_price;
            document.getElementById('currPB').textContent = data.stats.latest_pb;
            document.getElementById('avgPB').textContent = data.stats.avg_pb;
            document.getElementById('maxPB').textContent = data.stats.max_pb;
            document.getElementById('minPB').textContent = data.stats.min_pb;

            // 更新图表
            updateChart(data);
        }

        function initChart() {
            chart = echarts.init(document.getElementById('mainChart'), 'dark', { backgroundColor: 'transparent' });
            window.addEventListener('resize', () => chart.resize());
        }

        function updateChart(data) {
            const option = {
                title: {
                    text: data.name + ' (' + data.symbol + ') 估值走势',
                    left: 'center',
                    textStyle: { color: '#fff', fontSize: 18, fontWeight: 'normal' }
                },
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(20, 20, 20, 0.8)',
                    borderColor: '#444',
                    textStyle: { color: '#eee' },
                    axisPointer: { lineStyle: { color: '#aaa' } }
                },
                legend: {
                    data: ['股价 (复权)', '市净率 (PB)'],
                    bottom: 0,
                    textStyle: { color: '#ccc' }
                },
                grid: {
                    top: '15%',
                    left: '3%',
                    right: '3%',
                    bottom: '12%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: data.dates,
                    axisLine: { lineStyle: { color: '#444' } },
                    axisLabel: { color: '#888' }
                },
                yAxis: [
                    {
                        type: 'value',
                        name: '市净率 (PB)',
                        position: 'left',
                        axisLine: { show: true, lineStyle: { color: '#58a6ff' } },
                        splitLine: { lineStyle: { color: '#222' } },
                        axisLabel: { color: '#58a6ff' }
                    },
                    {
                        type: 'value',
                        name: '股价 (RMB)',
                        position: 'right',
                        axisLine: { show: true, lineStyle: { color: '#f78166' } },
                        splitLine: { show: false },
                        axisLabel: { color: '#f78166' }
                    }
                ],
                dataZoom: [
                    { type: 'inside', start: 50, end: 100 },
                    { type: 'slider', bottom: 40, height: 20, borderColor: 'transparent', backgroundColor: 'rgba(255,255,255,0.05)', fillerColor: 'rgba(88, 166, 255, 0.2)' }
                ],
                series: [
                    {
                        name: '市净率 (PB)',
                        type: 'line',
                        data: data.pbs,
                        showSymbol: false,
                        yAxisIndex: 0,
                        itemStyle: { color: '#58a6ff' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(88, 166, 255, 0.3)' },
                                { offset: 1, color: 'rgba(88, 166, 255, 0)' }
                            ])
                        },
                        markLine: {
                            silent: true,
                            data: [
                                { type: 'average', name: '平均值', lineStyle: { color: 'rgba(255,255,255,0.3)', type: 'dashed' } }
                            ]
                        }
                    },
                    {
                        name: '股价 (复权)',
                        type: 'line',
                        data: data.prices,
                        showSymbol: false,
                        yAxisIndex: 1,
                        itemStyle: { color: '#f78166' },
                        lineStyle: { width: 3 }
                    }
                ]
            };

            chart.setOption(option, true);
        }

        init();
    </script>
</body>
</html>
